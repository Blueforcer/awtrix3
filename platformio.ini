; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ulanzi

[env]
framework = arduino
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	bblanchon/ArduinoJson@^6.20.0
	evert-arias/EasyButton@2.0.1
	fastled/FastLED@^3.6.0
	marcmerlin/FastLED NeoMatrix@^1.2
	knolleary/PubSubClient@^2.8
	densaugeo/base64@^1.4.0
	luisllamasbinaburo/MeanFilterLib@^1.0.0
	adafruit/Adafruit BME280 Library@^2.2.2
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit HTU21DF Library@^1.0.5
	adafruit/Adafruit SHT31 Library@^2.2.0
	plerup/EspSoftwareSerial@^8.1.0
	maxgerhardt/ghostl

[env:ulanzi]
platform = espressif32@6.3.0
board = esp32dev
build_flags = 
	-DULANZI
	-DMQTT_MAX_PACKET_SIZE=8192
	-D CORE_DEBUG_LEVEL=0
	-Wno-attributes
	-Os
	-fno-exceptions
lib_deps = 
	${env.lib_deps}


[env:awtrix2_upgrade]
platform = espressif32
board = wemos_d1_mini32
build_flags = 
	-Dawtrix2_upgrade
	-DMQTT_MAX_PACKET_SIZE=8192
	-D CORE_DEBUG_LEVEL=0
	-D NDEBUG
	-Wno-attributes
	-Os
	-fno-exceptions
lib_deps = 
	${env.lib_deps}

; ESP8266 (Wemos D1 mini, original AWTRIX 2 controller) - reduced feature set.
; Uses the AWTRIX 2 pinout (shared with awtrix2_upgrade). Not included:
; sound (buzzer/DFPlayer), games, online HTTPS update, deep sleep wake button.
[env:esp8266]
platform = espressif8266@4.2.1
board = d1_mini
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_filters = esp8266_exception_decoder
build_src_filter = +<*> -<Games/> -<MelodyPlayer/>
build_flags = 
	-Dawtrix2_upgrade
	; FastLED pin numbers are GPIO numbers on every board (not NodeMCU D-labels).
	; Default matrix data pin is GPIO4 (D2); change it with -D MATRIX_PIN=<gpio>
	; or at runtime with "matrix_pin" in dev.json.
	-D FASTLED_ESP8266_RAW_PIN_ORDER
	; MQTT buffer: small at startup, grown to 4 KB only when a broker is configured
	-DMQTT_MAX_PACKET_SIZE=256
	-D AWTRIX_MQTT_BUFFER_SIZE=4096
	-D NDEBUG
	-Wno-attributes
	-Os
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
lib_deps = 
	bblanchon/ArduinoJson@^6.20.0
	evert-arias/EasyButton@2.0.1
	fastled/FastLED@3.6.0
	marcmerlin/FastLED NeoMatrix@^1.2
	knolleary/PubSubClient@^2.8
	densaugeo/base64@^1.4.0
	luisllamasbinaburo/MeanFilterLib@^1.0.0
	adafruit/Adafruit BME280 Library@^2.2.2
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit HTU21DF Library@^1.0.5
	adafruit/Adafruit SHT31 Library@^2.2.0
	vshymanskyy/Preferences@^2.1.0
lib_ignore = 
	DFMiniMp3

; ESP8266 with a native 16x16 panel: the canvas is 16x16 and the apps use a square
; layout (time as two lines, icon above text). Everything else as the esp8266 env.
[env:esp8266_16x16]
extends = env:esp8266
build_flags = 
	${env:esp8266.build_flags}
	-D AWTRIX_16X16
